# Builds the Android App Bundle (.aab) for Google Play, signed with your upload key.
# One-time setup (see docs/google-play.md): add these repository secrets
#   ANDROID_UPLOAD_KEYSTORE_BASE64  the upload keystore (.jks), base64-encoded
#   ANDROID_UPLOAD_STORE_PASSWORD   its password
#   ANDROID_UPLOAD_KEY_ALIAS        the key alias (e.g. upload)
#   ANDROID_UPLOAD_KEY_PASSWORD     the key password
# Then run Actions → Google Play bundle → Run workflow and upload the .aab from the run's artifacts in Play Console.
name: Google Play bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code (must be higher than any upload to Play; leave empty to use 100 + this workflow's run number)
        required: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the signing secrets
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "$SP" ] || missing="$missing ANDROID_UPLOAD_STORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing ANDROID_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error title=Missing secrets::Add these repository secrets first (see docs/google-play.md):$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Set up the upload key
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          code="${{ inputs.version_code }}"; [ -n "$code" ] || code=$((100 + ${{ github.run_number }}))
          if ! [[ "$code" =~ ^[0-9]+$ ]]; then echo "::error::Version code must be a whole number"; exit 1; fi
          echo "AVELUNE_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "AVELUNE_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Version code $code"
      - name: Build the signed app bundle
        working-directory: app/android
        env:
          AVELUNE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          AVELUNE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          AVELUNE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew bundleRelease --no-daemon 2>&1 | tee build.log; then
            msg=$(grep -nE "What went wrong|error:|^e: |FAILED|Could not|Unresolved reference|Execution failed|> " build.log | grep -v "UP-TO-DATE" | tail -60 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
      - name: Check the signature
        run: |
          AAB=app/android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256" | head -3
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then echo "::error::The bundle is signed with the debug key"; exit 1; fi
          mkdir -p out && cp "$AAB" "out/Avelune-$(node -p "require('./app/app.json').expo.version")-play-$AVELUNE_VERSION_CODE.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: avelune-play-aab
          path: out/*.aab
          if-no-files-found: error
