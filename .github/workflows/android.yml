name: Android APK

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build release APK
        working-directory: app/android
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
            # Surface the root cause as one annotation (readable from the API without downloading logs).
            msg=$(grep -nE "What went wrong|error:|^e: |FAILED|Could not|Unresolved reference|Execution failed|> " build.log | grep -v "^.*> Task .* UP-TO-DATE" | tail -60 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cyclo-android-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
